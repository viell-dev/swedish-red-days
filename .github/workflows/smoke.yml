name: Live Smoke Check

on:
  schedule:
    # Weekly, Mondays 05:17 UTC
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  BASE_URL: https://swedish-red-days.me-cloudflare-447.workers.dev

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Main endpoint returns a calendar
        run: |
          headers="$(curl -fsSI "$BASE_URL/")"
          echo "$headers"
          echo "$headers" | grep -i "^content-type: text/calendar; charset=utf-8"

      - name: Current-year calendar contains expected events
        run: |
          body="$(curl -fsS "$BASE_URL/?years_back=0&years_forward=0&lang=english")"
          echo "$body" | grep -c "BEGIN:VEVENT"
          echo "$body" | grep -q "BEGIN:VCALENDAR"
          echo "$body" | grep -q "END:VCALENDAR"
          echo "$body" | grep -q "SUMMARY:Midsummer Day"
          echo "$body" | grep -q "SUMMARY:Christmas Day"

      - name: Invalid year offset returns 400
        run: |
          status="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/?years_back=1.5")"
          echo "HTTP $status"
          test "$status" = "400"
